name: Validate PHP server

on:
  push:
    branches: [server-auto, server-auto-v2]
  pull_request:
    branches: [server-auto, server-auto-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: php -l router.php
      - run: php -l lib/trivial.php
      - run: php -l lib/v2.php
      - run: node --check src/server-app-v2.js
      - run: php tests_php/smoke.php
      - run: php tests_php/v2.php
      - run: php tests_php/offline.php
