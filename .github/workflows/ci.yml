name: Validate static Trivial

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: node --check src/app.js
      - run: node --check src/pages-engine.js
      - run: node --check src/pages-db.js
      - run: node scripts/validate-data.mjs
      - run: node --test tests/pages-engine.test.mjs tests/csv.test.mjs tests/question-bank-growth.test.mjs
