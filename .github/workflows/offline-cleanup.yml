name: One-time offline cleanup

on:
  push:
    branches: [server-auto]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'Remove GitHub runtime update code'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: server-auto
      - name: Remove updater code
        shell: bash
        run: |
          perl -0pi -e "s/\nconst TRIVIAL_BRANCH = 'server-auto';\n/\n/" lib/trivial.php
          perl -0pi -e "s/,'update'=>auto_update_status\(\)//" lib/trivial.php
          perl -0pi -e 's/\nfunction auto_update_status\(\): array \{.*\z/\n/s' lib/trivial.php
          if grep -Eq 'maybe_auto_update|auto_update_status|git[[:space:]]+-C|git pull|TRIVIAL_BRANCH|TRIVIAL_AUTO_UPDATE' lib/trivial.php; then
            echo 'Updater references remain in lib/trivial.php' >&2
            exit 1
          fi
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'Paruski'
          git config user.email 'paruskigoogle.flagstick503@passmail.com'
          git add lib/trivial.php
          git commit -m 'Remove GitHub runtime update code'
          git push origin HEAD:server-auto
